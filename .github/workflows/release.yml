name: Release (APK + AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ env.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
      - name: Build release (signed)
        env:
          KEYSTORE_FILE: android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ env.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease bundleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Create GitHub Release (signed only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"
          android/app/build/outputs/apk/release/app-release.apk
          android/app/build/outputs/bundle/release/app-release.aab
          --title "دخل‌وخرج از $GITHUB_REF_NAME"
          --notes "Release build (signed)"
